# Runs on GitHub-hosted runners (free for public repositories).
name: MEMORA checks

on:
  pull_request:
  push:
    branches: [main, "fix/**", "feature/**"]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MEMORA_DB_PATH: /tmp/memora-ci/memora.sqlite
      MEMORA_LOG_DIR: /tmp/memora-ci/logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install core + dev dependencies (no hardware/cloud extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Static analysis (correctness rules)
        run: ruff check .
      - name: Test suite
        run: python -m pytest tests/ -q -p no:cacheprovider -rs
      - name: Simulated user journeys
        run: python app.py --simulate
      - name: Diagnostics
        run: python app.py --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t memora:ci -f deployment/docker/Dockerfile .
      - name: Diagnostics inside the container
        run: docker run --rm memora:ci python app.py --check
      - name: Chat persists across container runs
        run: |
          docker volume create memora-ci
          printf 'yes\nMy name is Ana\nMy son is Leo\n/quit\n' | docker run --rm -i -v memora-ci:/data memora:ci
          printf 'Who is my son?\n/quit\n' | docker run --rm -i -v memora-ci:/data memora:ci | tee out.txt
          grep -q "your son is Leo" out.txt
