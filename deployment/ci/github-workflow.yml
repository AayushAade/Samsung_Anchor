# TEMPLATE ONLY: copy to .github/workflows/ to activate (consumes GitHub Actions minutes).
name: Memora CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite (core dependencies only; hardware/cloud tests skip)
        run: |
          pytest tests/ -q

      - name: Diagnostics smoke test
        run: |
          MEMORA_DB_PATH=/tmp/ci/memora.sqlite python app.py --check

      - name: Build Docker Image
        run: |
          docker build -t memora:latest -f deployment/docker/Dockerfile .
